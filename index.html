<style>
[hidden] { display: none !important; }
/* Layout: one full-bleed map with a floating route panel, bottom sheet on phones. */
:root {
  --bg: #e9ece6; --fg: #15191c; --muted: #5e676d; --faint: #8a9298;
  --material: rgba(250, 251, 249, .9); --solid: #ffffff; --well: rgba(20, 30, 35, .06); --line: rgba(20, 30, 35, .12);
  --accent: #0a6fe0; --on-accent: #ffffff; --accent-soft: rgba(10, 111, 224, .12);
  --high: #0b8f7c; --mid: #d08700; --low: #d9482b; --pending: #7a5fb5; --pending-soft: rgba(122, 95, 181, .13);
  --shadow: 0 8px 30px rgba(15, 25, 30, .18), 0 1px 3px rgba(15, 25, 30, .12);
  --start: #0f7a45; --end: #c72f2f;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171b1e; --fg: #eef1f2; --muted: #a2abb1; --faint: #788188;
  --material: rgba(34, 39, 43, .9); --solid: #2a3034; --well: rgba(255, 255, 255, .08); --line: rgba(255, 255, 255, .13);
  --accent: #5aa7ff; --on-accent: #06203d; --accent-soft: rgba(90, 167, 255, .17);
  --high: #38c9b3; --mid: #eeb13c; --low: #ff7d60; --pending: #b9a2ec; --pending-soft: rgba(185, 162, 236, .16);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #171b1e; --fg: #eef1f2; --muted: #a2abb1; --faint: #788188;
  --material: rgba(34, 39, 43, .9); --solid: #2a3034; --well: rgba(255, 255, 255, .08); --line: rgba(255, 255, 255, .13);
  --accent: #5aa7ff; --on-accent: #06203d; --accent-soft: rgba(90, 167, 255, .17);
  --high: #38c9b3; --mid: #eeb13c; --low: #ff7d60; --pending: #b9a2ec; --pending-soft: rgba(185, 162, 236, .16);
  --shadow: 0 8px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tn { font-variant-numeric: tabular-nums; }
#map { position: absolute; inset: 0; }
.maplibregl-map { overflow: hidden; position: absolute; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; user-select: none; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

.panel { position: absolute; z-index: 5; left: 14px; top: 14px; bottom: 14px; width: 392px; display: flex; flex-direction: column; background: var(--material); -webkit-backdrop-filter: saturate(170%) blur(22px); backdrop-filter: saturate(170%) blur(22px); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.handle { display: none; }
.head { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand strong { font-size: 17px; letter-spacing: -.01em; font-weight: 650; }
.brand .sub { color: var(--muted); font-size: 12px; }
.brand .sp { flex: 1; }
.lang { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--well); }
.ask { display: flex; align-items: center; gap: 8px; background: var(--well); border-radius: 12px; padding: 0 6px 0 11px; height: 40px; }
.ask svg { flex: none; color: var(--muted); }
.ask input { flex: 1; min-width: 0; border: 0; background: none; outline: 0; height: 100%; }
.ask input::placeholder { color: var(--muted); }
.ask button { flex: none; height: 28px; padding: 0 10px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; }
.askNote { font-size: 12px; color: var(--muted); margin-top: -3px; }
.askNote b { color: var(--fg); font-weight: 600; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: .5px solid var(--line); }
.tabs button { flex: 1; padding: 8px 2px 9px; color: var(--muted); font-size: 13px; font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -.5px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.row { display: grid; gap: 6px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 550; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
select { width: 100%; height: 34px; border-radius: 9px; border: .5px solid var(--line); background: var(--solid); padding: 0 8px; }
.seg { display: flex; background: var(--well); border-radius: 9px; padding: 2px; }
.seg button { flex: 1; min-width: 0; height: 30px; border-radius: 7px; font-size: 12.5px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--solid); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 550; }
.chip.plain { background: var(--well); color: var(--fg); }
.chip .n { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 10.5px; font-weight: 700; }
.chip.more { background: none; border: 1px dashed var(--line); color: var(--fg); }
.pending { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px; background: var(--pending-soft); color: var(--pending); font-size: 11px; font-weight: 600; white-space: nowrap; }
.sect { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sect h3 { margin: 0; font-size: 14px; font-weight: 650; }
.poiList { display: flex; flex-direction: column; border: .5px solid var(--line); border-radius: 11px; background: var(--solid); overflow: hidden; }
.poiRow { display: flex; align-items: center; gap: 9px; padding: 8px 10px; text-align: left; width: 100%; border-bottom: .5px solid var(--line); }
.poiRow:last-child { border-bottom: 0; }
.poiRow .box { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; color: var(--on-accent); font-size: 11px; font-weight: 700; }
.poiRow[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.poiRow .nm { flex: 1; min-width: 0; font-size: 13.5px; }
.poiRow .cat { color: var(--muted); font-size: 12px; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt { width: 100%; text-align: left; padding: 10px 11px; border-radius: 12px; background: var(--well); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; border: 1.5px solid transparent; }
.opt[aria-pressed="true"] { background: var(--solid); border-color: var(--accent); }
.opt .t { font-weight: 600; font-size: 13.5px; }
.opt .d { color: var(--muted); font-size: 12px; grid-column: 1; }
.opt .v { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; }
.opt .v b { display: block; font-size: 16px; font-weight: 650; }
.opt .v span { font-size: 12px; color: var(--muted); }
.opt.off { cursor: default; opacity: .9; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--well); border-radius: 10px; padding: 8px 10px; }
.stat span { display: block; font-size: 11.5px; color: var(--muted); }
.stat b { font-size: 17px; font-weight: 650; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--well); }
.bar i { display: block; height: 100%; }
.barKey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.warn { padding: 8px 11px; border-radius: 10px; background: color-mix(in srgb, var(--low) 13%, transparent); color: var(--low); font-size: 12.5px; font-weight: 550; }
.steps { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
.step .pin { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; }
.step .pin.m { border-radius: 7px; background: var(--fg); color: var(--bg); font-size: 10px; }
.step .nm { font-weight: 600; font-size: 13.5px; padding-top: 2px; }
.leg { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; min-height: 34px; }
.leg .ln { justify-self: center; width: 3px; border-radius: 2px; margin: 2px 0; }
.leg .tx { color: var(--muted); font-size: 12px; align-self: center; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: right; font-weight: 550; color: var(--muted); padding: 5px 4px; border-bottom: .5px solid var(--line); }
.tbl td { text-align: right; padding: 7px 4px; border-bottom: .5px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.lead { font-size: 13.5px; margin: 0; }
.lead b { font-weight: 650; }
.planRow { width: 100%; text-align: left; padding: 9px 11px; background: var(--well); border-radius: 11px; display: grid; gap: 5px; border: 1.5px solid transparent; }
.planRow[aria-pressed="true"] { border-color: var(--low); background: var(--solid); }
.planRow .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 13.5px; }
.planRow .top span { color: var(--low); font-weight: 650; white-space: nowrap; }
.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 8px 0; border-bottom: .5px solid var(--line); }
.src:last-child { border-bottom: 0; }
.src b { font-weight: 600; font-size: 13.5px; }
.src small { grid-column: 1; color: var(--muted); font-size: 12px; }
.src .st { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.st.ok { background: color-mix(in srgb, var(--high) 15%, transparent); color: var(--high); }
.st.part { background: color-mix(in srgb, var(--mid) 17%, transparent); color: var(--mid); }
.st.wait { background: var(--pending-soft); color: var(--pending); }

.ctl { position: absolute; z-index: 4; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.ctlGroup { background: var(--material); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 11px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.ctlGroup button { width: 38px; height: 38px; display: grid; place-items: center; font-weight: 650; font-size: 13px; border-bottom: .5px solid var(--line); }
.ctlGroup button:last-child { border-bottom: 0; }
.ctlGroup button[aria-pressed="true"] { color: var(--accent); }
.layers { background: var(--material); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 12px; width: 214px; display: grid; gap: 1px; }
.layers label { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; }
.layers .pend { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 0; font-size: 13px; color: var(--muted); }
.foot { position: absolute; z-index: 3; right: 14px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.sun, .legend { background: var(--material); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 10px; box-shadow: var(--shadow); padding: 6px 10px; font-size: 12px; display: flex; gap: 10px; align-items: center; }
.sun b { font-weight: 650; }
.attr { font-size: 10.5px; color: var(--muted); background: var(--material); padding: 1px 6px; border-radius: 5px; max-width: 340px; text-align: right; }
.err { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; padding: 24px 24px 24px 430px; color: var(--muted); text-align: center; }

.mk { display: grid; place-items: center; transform: translateY(0); cursor: pointer; }
.mk .p { width: 11px; height: 11px; border-radius: 50%; background: var(--solid); border: 2.5px solid var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.mk.on .p { width: 26px; height: 26px; background: var(--accent); border: 2px solid var(--solid); color: var(--on-accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.mk .tag { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--fg); padding: 0 4px; border-radius: 4px; background: var(--material); pointer-events: none; }
.mk:not(.on) .tag { display: none; }
.showLabels .mk .tag { display: block; }
.st-mk { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 5px; background: var(--solid); border: 1.5px solid var(--fg); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); font-size: 9px; font-weight: 800; }
.st-mk.on { width: 25px; height: 25px; border-radius: 7px; background: var(--fg); color: var(--bg); font-size: 10px; }
.st-mk .tag { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 2px; white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--fg); padding: 0 4px; border-radius: 4px; background: var(--material); pointer-events: none; }
.st-mk .tag { display: none; }
.showLabels .st-mk .tag { display: block; }
.ex { display: none; place-items: center; min-width: 17px; height: 15px; padding: 0 3px; border-radius: 4px; background: var(--fg); color: var(--bg); font-size: 9.5px; font-weight: 700; line-height: 1; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); white-space: nowrap; }
.showExits .ex { display: grid; }
.ex.used { display: none !important; }
.flag { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.flag .ftxt { color: #ffffff; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 8px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.flag .stem { width: 2.5px; height: 9px; }
.flag .tip { width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid #ffffff; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); margin-top: -1px; }
.flag.s .ftxt, .flag.s .stem, .flag.s .tip { background: var(--start); }
.flag.e .ftxt, .flag.e .stem, .flag.e .tip { background: var(--end); }
.step .pin.s { background: var(--start); color: #ffffff; }
.step .pin.e { background: var(--end); color: #ffffff; }

@media (max-width: 760px) {
  .panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 58%; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .panel.small { height: 112px; }
  .handle { display: block; width: 100%; height: 18px; flex: none; }
  .handle::after { content: ""; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--faint); margin: 7px auto 0; }
  .head { padding: 2px 14px 8px; }
  .brand .sub { display: none; }
  .body { padding: 12px 14px 18px; overflow-x: hidden; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .askNote { display: none; }
  .ctl { top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); }
  .foot { display: none; }
  .err { padding: 24px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
const D = window.SHADE_DATA;
const P = window.POPULARITY_DATA;
D.pois = P.places; D.segs = window.SHADE_NETWORK.segs;
D.plan = window.SHADE_NETWORK.plan;
installSvi(D);
installExits(D);
const router = createWalkingRouter(D);
const [OX, OY, K] = D.origin;
const $ = id => document.getElementById(id);
const dec = a => { const o = []; let x = 0, y = 0; for (let i = 0; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; o.push([+(OX + x / K).toFixed(5), +(OY + y / K).toFixed(5)]); } return o; };
const WALK = 75; // metres per minute, about 4.5 km/h

const I18N = {
  zh: { sub: "遮阴步行路线 · 原型", langBtn: "EN", ph: "例如：中午少晒太阳，一小时内逛博物馆", send: "设置", askHint: "概念演示：按关键词解析，尚未连接 AI 模型。", understood: "已设置", notUnderstood: "没有识别到条件，可以试试时段、时长或“博物馆”。", tabRoute: "路线", tabCompare: "方法比较", tabPlan: "规划视角", tabData: "数据",

const costMemo = {};

function perms(a) { if (a.length < 2) return [a]; const o = []; a.forEach((x, i) => perms(a.filter((_, j) => j !== i)).forEach(p => o.push([x, ...p]))); return o; }

  const start = state.startExit != null ? "x" + state.startExit : "s" + state.start;
  const ends = state.endExit != null ? ["x" + state.endExit] : state.endStation != null ? ["s" + state.endStation] : D.stations.map((_, e) => "s" + e);
  let best = null;
  for (const p of perms(sel)) {
    let c = legCost(s, start, "p" + p[0]);
    for (let i = 1; i < p.length; i++) c += legCost(s, "p" + p[i - 1], "p" + p[i]);
    for (const e of ends) {
      const tot = c + legCost(s, "p" + p[p.length - 1], e);

  <p class="lead">${T("cmpLeadP")(Math.round(p.L - a.L), a.posts.total.toLocaleString(), p.posts.total.toLocaleString())}</p></section>
  <section class="group"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>${T("method")}</th><th>${T("km")}</th><th>${T("shadeCol")}</th><th>${T("modelCol")}</th><th>${T("sviCover")}</th><th>${T("postsCol")}</th></tr></thead><tbody>
  ${row("D", d)}${row("P", p)}${row("B", b)}${row("A", a)}${row("C", c, "base")}</tbody></table></div>
  <p class="note">${T("cmpNote")}</p></section>
  ${sviFindings()}
  <section class="group"><h3>${T("sens")}</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>${T("sensCol")}</th><th>${T("km")}</th><th>${T("shadeCol")}</th><th>${T("exposed")}</th></tr></thead><tbody>${sens.map(([w, x]) => `<tr><td>${wl[w]}</td><td class="tn">${fmtKm(x.L)}</td><td class="tn">${pct(x.share)}%</td><td class="tn">${Math.round(x.maxRun / 10) * 10} m</td></tr>`).join("")}</tbody></table></div></section>
  <p class="note">${T("svi")}</p>`;
}
function planTab() {
  return `<p class="lead">${T("planLead")}</p>${D.plan.map((p, i) => `<button class="planRow" data-act="hi" data-v="${i}" aria-pressed="${state.hi === i}"><span class="top"><span style="color:var(--fg);font-weight:600">${esc(p.name)}</span><span class="tn">${T("planExp")(pct(p.sun / p.m))}</span></span><span class="note tn">${T("planLen")(p.m)}</span><span class="bar"><i style="width:${pct(p.sun / p.m)}%;background:var(--low)"></i></span></button>`).join("")}<p class="note">${T("planNote")}</p>`;
}
function dataTab() {
  const lab = { ok: T("ok"), part: T("part"), wait: T("pend") };
  return `<p class="lead">${T("dataLead")}</p>${sviDataNotes()}${popularityDataNotes()}<p class="note">${T("exitsNote")(D.exits.length)}</p><div>${T("srcs").map(([a, b, s]) => `<div class="src"><b>${a}</b><small>${b}</small><span class="st ${s}">${lab[s]}</span></div>`).join("")}</div>
  <div class="row"><h3 style="margin:0;font-size:14px;font-weight:650">${T("assume")}</h3><ul class="note" style="padding-left:18px;margin:0;display:grid;gap:3px">${T("assumes")(D.sunDate).map(x => `<li>${x}</li>`).join("")}</ul></div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function renderHead() {
  $("brandSub").textContent = T("sub"); $("lang").textContent = T("langBtn"); $("ask").placeholder = T("ph"); $("askBtn").textContent = T("send");
  const n = state.note;
  $("askNote").innerHTML = n && n.warn ? `<span style="color:var(--low)">${esc(n.warn)}</span>` : n && n.done ? `<b>${T("understood")}：</b>${esc(n.done)}` : "";
  $("tabs").innerHTML = [["route", "tabRoute"], ["compare", "tabCompare"], ["plan", "tabPlan"], ["data", "tabData"]].map(([id, k]) => `<button role="tab" data-tab="${id}" aria-selected="${state.tab === id}">${T(k)}</button>`).join("");
}
function renderBody() {
  const b = $("body"), top = b.scrollTop;
  b.innerHTML = state.tab === "route" ? routeTab() : state.tab === "compare" ? compareTab() : state.tab === "plan" ? planTab() : dataTab();
  b.scrollTop = top;
}
function renderChrome() {
  const s = D.times[state.time];
  $("sun").innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><b>${T("sunFmt")(s.h, Math.round(s.el))}</b>`;
  $("legend").innerHTML = `<span><i class="dot" style="background:var(--high)"></i>${T("legendHigh")}</span><span><i class="dot" style="background:var(--mid)"></i>${T("legendMid")}</span><span><i class="dot" style="background:var(--low)"></i>${T("legendLow")}</span>`;
  $("attr").textContent = T("attr");
  const L = state.layers;
  $("modeLegend").innerHTML = modeLegend();
  $("modeLegend").hidden = state.mapMode === "standard";
  $("layers").innerHTML = `${modeControls()}<div class="lbl" style="padding:10px 0 3px">${T("layerTitle")}</div>
    <label><input type="checkbox" id="lExit" ${L.exits ? "checked" : ""}>${T("lExit")}</label>
    <label><input type="checkbox" id="lGreen" ${L.green ? "checked" : ""}>${T("lGreen")}</label>
    <label><input type="checkbox" id="lShelter" ${L.shelter ? "checked" : ""}>${T("lShelter")}</label>
    <label><input type="checkbox" id="lBuild" ${L.build ? "checked" : ""}>${T("lBuild")}</label>
    <label><input type="checkbox" id="lArea" ${L.area ? "checked" : ""}>${T("lArea")}</label>`;
}
function refresh(fit) { recompute(); renderHead(); renderBody(); renderChrome(); renderMap(fit); setSunLight(); }

$("body").addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'period') { state.period=v; state.recommendNote=null; refresh(false); }
  if (a === 'visitMode') { state.visitMode=v; state.recommendNote=null; renderBody(); }
  if (a === 'recommend') suggestPopularStops();
  if (a === 'clear') { state.sel=[]; state.recommendNote=null; refresh(false); }
  if (a === 'loadMore') { state.listLimit+=20; renderBody(); }
  if (a === "limit") { state.limit = +v; state.recommendNote=null; refresh(false); }
  if (a === "time") { state.time = +v; state.recommendNote=null; refresh(false); }
  if (a === "w") { state.w = +v; state.recommendNote=null; refresh(false); }
  if (a === "scheme") selectScheme(v);
  if (a === "picker") { state.picker = !state.picker; $("body").scrollTop = 0; renderBody(); renderMap(false); }
  if (a === "cat") { state.cat = v; renderBody(); }
  if (a === "poi") togglePoi(+v);
  if (a === "hi") { state.hi = state.hi === +v ? null : +v; renderBody(); renderMap(state.hi != null); }
});
$("body").addEventListener('toggle',ev=>{if(ev.target.id==='legsDetails')state.legsOpen=ev.target.open;},true);
$("body").addEventListener("change", ev => {
  const {id,value,checked}=ev.target;
  if(id==='startSel') { state.start=+value; state.startExit=null; state.recommendNote=null; refresh(true); return; }
  if(id==='startExitSel') { state.startExit=value===''?null:+value; refresh(true); return; }
  if(id==='endSel') { state.endStation=value===''?null:+value; state.endExit=null; refresh(true); return; }
  if(id==='endExitSel') {
    if(value==='') state.endExit=null;
    else { state.endExit=+value; state.endStation=D.exits[+value].st; }
    refresh(true); return;
  }
  if(id==='prefTime') { state.time=+value; refresh(false); return; }
  if(id==='prefLimit') { state.limit=+value; refresh(false); return; }
  if(id==='prefW') { state.w=+value; refresh(false); return; }
  if(id==='catalogue') { state.catalogue=value; state.cat='all'; state.listLimit=10; }
  else if(id==='popSort') { state.sort=value; state.listLimit=10; }
  else if(id==='placeCategory') { state.cat=value; state.listLimit=10; }
  else if(id==='includeCaptions') state.includeCaptions=checked;
  else if(id==='dateFrom' || id==='dateTo') {
    if(!value) { renderBody(); return; }
    const from=id==='dateFrom'?value:state.dateFrom, to=id==='dateTo'?value:state.dateTo;
    if(from>to || from<P.meta.earliest || to>P.meta.latest) {
      state.note={warn:state.lang==='en'?'Choose a valid date range within the snapshot.':'请选择快照范围内的有效日期。'};
      renderHead(); renderBody(); return;
    }
    state[id]=value;
  } else return;
  state.note=null; state.recommendNote=null; refresh(false);
});
$("body").addEventListener('input',ev=>{
  if(ev.target.id!=='placeSearch') return;
  const pos=ev.target.selectionStart;
  state.search=ev.target.value; state.listLimit=10; state.recommendNote=null;
  renderBody(); const search=$('placeSearch'); search.focus();
  if(pos!=null) search.setSelectionRange(pos,pos);
  renderMap(false);
});
$("tabs").addEventListener("click", ev => { const b = ev.target.closest("[data-tab]"); if (!b) return; state.tab = b.dataset.tab; if (state.tab !== "plan" && state.hi != null) { state.hi = null; renderMap(false); } renderHead(); renderBody(); $("body").scrollTop = 0; });
$("lang").addEventListener("click", () => { state.lang = state.lang === "zh" ? "en" : "zh"; state.note = null; document.documentElement.lang = state.lang === "zh" ? "zh-Hans" : "en"; refresh(false); });
$("handle").addEventListener("click", () => $("panel").classList.toggle("small"));
$("zin").addEventListener("click", () => map && map.zoomIn());
$("zout").addEventListener("click", () => map && map.zoomOut());
$("bFit").addEventListener("click", () => fitRoute());
$("b3d").addEventListener("click", () => { state.is3d = !state.is3d; $("b3d").setAttribute("aria-pressed", state.is3d); if (map) { renderMap(false); map.easeTo({ pitch: state.is3d ? 52 : 0, bearing: state.is3d ? -18 : 0, duration: 550 }); } });
$("bLayers").addEventListener("click", () => { const l = $("layers"); l.hidden = !l.hidden; $("bLayers").setAttribute("aria-pressed", !l.hidden); });
$("layers").addEventListener("click", ev => { const b = ev.target.closest("[data-mode]"); if (!b) return; state.mapMode = b.dataset.mode; renderChrome(); updateMapModes(); });
$("layers").addEventListener("change", ev => { const m = { lExit: "exits", lGreen: "green", lShelter: "shelter", lBuild: "build", lArea: "area" }[ev.target.id]; if (m) { state.layers[m] = ev.target.checked; if (map) zoomClasses(); renderMap(false); } });
$("askForm").addEventListener("submit", ev => { ev.preventDefault(); applyAsk($("ask").value); });
function applyAsk(q) {
  const s = q.toLowerCase(), done = [];
  if (/早|上午|morning|9\s*(am|点|:)/.test(s)) { state.time = 0; done.push("9:00"); }
  else if (/中午|正午|noon|lunch|1\s*(pm|点)/.test(s)) { state.time = 1; done.push("13:00"); }
  else if (/下午|傍晚|afternoon|evening|5\s*(pm|点)/.test(s)) { state.time = 2; done.push("17:00"); }
  if (/少晒|阴凉|遮阴|防晒|怕热|shade|shady|less sun|cool/.test(s)) { state.scheme = "D"; state.w = 2; done.push(T("D")); }
  if (/最短|别绕|少绕|不绕|shortest|fast|quick/.test(s)) { state.w = 0; done.push(T("less")); }
  let m;
  if ((m = s.match(/(\d+)\s*(分钟|min)/))) { state.limit = +m[1] <= 30 ? 30 : +m[1] <= 60 ? 60 : 90; done.push(`${state.limit} ${T("min")}`); }
  else if ((m = s.match(/(\d+|一|半|两)\s*(个)?\s*(小时|hour)/)) || /an hour/.test(s)) { const h = !m ? 1 : m[1] === "半" ? .5 : m[1] === "一" ? 1 : m[1] === "两" ? 2 : +m[1]; state.limit = h <= .5 ? 30 : h <= 1 ? 60 : 90; done.push(`${state.limit} ${T("min")}`); }
  if (/popular|popularity|trending|热度|热门/.test(s)) { state.scheme = "P"; done.push(T("P")); }
  const catHit = [["museum", /博物馆|美术馆|museum|gallery/], ["heritage", /历史|古迹|教堂|heritage|history|church/], ["landmark", /地标|打卡|landmark|icon/], ["park", /公园|绿地|park|garden/]].find(([, re]) => re.test(s));
  if (catHit) { const idx = D.pois.map((p, i) => [p, i]).filter(([p]) => p.cat === catHit[0] && p.routable).map(([, i]) => i).slice(0, 4); state.sel = idx; done.push(T(catHit[0])); }
  state.tab = "route";
  if (!done.length && q.trim()) { state.search = q.trim(); state.picker = true; state.listLimit = 10; state.note = null; refresh(false); return; }
  state.note = done.length ? { done: done.join(" · ") } : null;
  state.picker = false;
  refresh(!!catHit);
}
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

recompute(); renderHead(); renderBody(); renderChrome(); renderMarkers(null);
try { initMap(); } catch (e) { $("err").hidden = false; $("err").textContent = T("noMap"); }
</script>
